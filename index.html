<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BelKhedma Driver Location</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      :root {
        --bg: var(--tg-theme-bg-color, #ffffff);
        --text: var(--tg-theme-text-color, #111111);
        --hint: var(--tg-theme-hint-color, #6b7280);
        --button: var(--tg-theme-button-color, #2481cc);
        --button-text: var(--tg-theme-button-text-color, #ffffff);
        --card: var(--tg-theme-secondary-bg-color, #f3f4f6);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Tahoma, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }

      .card {
        width: min(520px, 100%);
        background: var(--card);
        border-radius: 16px;
        padding: 20px;
        text-align: center;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 20px;
      }

      p {
        margin: 0;
        color: var(--hint);
        line-height: 1.6;
      }

      .status {
        margin-top: 18px;
        font-size: 15px;
      }

      .spinner {
        width: 42px;
        height: 42px;
        border: 4px solid rgba(0, 0, 0, 0.1);
        border-top-color: var(--button);
        border-radius: 50%;
        margin: 0 auto 12px;
        animation: spin 0.8s linear infinite;
      }

      .success {
        color: #0a7f3f;
      }

      .error {
        color: #b00020;
      }

      .action {
        margin-top: 14px;
      }

      .hidden {
        display: none;
      }

      button {
        border: none;
        border-radius: 10px;
        background: var(--button);
        color: var(--button-text);
        padding: 10px 16px;
        font-size: 14px;
        cursor: pointer;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>تحديد موقع السائق</h1>
      <p>سيتم إرسال موقعك الحالي إلى البوت لتفعيل العمل فورًا.</p>
      <div class="status" id="status">
        <div class="spinner" id="spinner"></div>
        <div id="statusText">جاري تحديد الموقع...</div>
      </div>
      <div class="action hidden" id="retryContainer">
        <button id="retryBtn" type="button">إعادة المحاولة</button>
      </div>
    </div>

    <script>
      (function () {
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const statusText = document.getElementById("statusText");
        const spinner = document.getElementById("spinner");
        const retryContainer = document.getElementById("retryContainer");
        const retryBtn = document.getElementById("retryBtn");
        const urlParams = new URLSearchParams(window.location.search);
        const locationApiUrl = (
          urlParams.get("location_api") ||
          "https://aims-feof-advertisers-show.trycloudflare.com/api/driver/location"
        ).trim();
        let watchId = null;
        let heartbeatId = null;
        let lastPosition = null;

        function setStatus(text, variant) {
          statusText.textContent = text;
          statusText.className = variant || "";
        }

        function showRetry(show) {
          retryContainer.style.display = show ? "block" : "none";
        }

        function stopSpinner() {
          spinner.style.display = "none";
        }

        function startSpinner() {
          spinner.style.display = "block";
        }

        async function publishLocation(position) {
          lastPosition = position;
          try {
            const response = await fetch(locationApiUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                type: "driver_location",
                init_data: tg.initData,
                latitude: position.coords.latitude,
                longitude: position.coords.longitude,
                accuracy: position.coords.accuracy || null,
                timestamp: new Date().toISOString(),
              }),
            });
            stopSpinner();
            if (!response.ok) {
              throw new Error(`Location API returned ${response.status}`);
            }
            setStatus(
              `تم تحديث موقعك بنجاح (${new Date().toLocaleTimeString()}).`,
              "success",
            );
          } catch (error) {
            stopSpinner();
            setStatus(
              "تعذر تحديث الموقع. تحقق من اتصالك ثم أعد المحاولة.",
              "error",
            );
            showRetry(true);
          }
        }

        function sendLocation() {
          showRetry(false);
          startSpinner();
          setStatus("جاري تحديد الموقع...");

          if (!navigator.geolocation) {
            stopSpinner();
            setStatus("هذا الجهاز لا يدعم خدمة الموقع.", "error");
            showRetry(true);
            return;
          }

          if (!locationApiUrl.toLowerCase().startsWith("https://")) {
            stopSpinner();
            setStatus(
              "رابط خادم الموقع الآمن غير مهيأ. تواصل مع الإدارة.",
              "error",
            );
            return;
          }

          navigator.geolocation.getCurrentPosition(
            (position) => {
              publishLocation(position);
              if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
              }
              if (heartbeatId !== null) {
                window.clearInterval(heartbeatId);
              }
              watchId = navigator.geolocation.watchPosition(
                publishLocation,
                () => {
                  setStatus("فشل تحديث الموقع المباشر. أعد المحاولة.", "error");
                  showRetry(true);
                },
                {
                  enableHighAccuracy: true,
                  timeout: 20000,
                  maximumAge: 5000,
                },
              );
              heartbeatId = window.setInterval(() => {
                if (lastPosition !== null) {
                  publishLocation(lastPosition);
                }
              }, 30000);
            },
            (error) => {
              stopSpinner();
              setStatus(
                error?.code === 1
                  ? "تم رفض إذن الموقع. فعّل الإذن ثم أعد المحاولة."
                  : "تعذر الحصول على موقعك. حاول مرة أخرى.",
                "error",
              );
              showRetry(true);
            },
            {
              enableHighAccuracy: true,
              timeout: 15000,
              maximumAge: 0,
            },
          );
        }

        retryBtn.addEventListener("click", sendLocation);
        sendLocation();
      })();
    </script>
  </body>
</html>
